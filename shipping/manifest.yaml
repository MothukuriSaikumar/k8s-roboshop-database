apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-config
  namespace: roboshop 
  labels:
    project: roboshop
    component: shipping
    tier: backend
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    tier: backend
spec:
  selector:
    matchLabels:
      project: roboshop
      component: shipping
      tier: backend
  replicas: 1
  template:
    metadata:
      labels:
        project: roboshop
        component: shipping
        tier: backend
    spec:
      containers:
      - name: shipping
        image: saikumar19/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: shipping-config
        ports:
        - name: liveness-port
          containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "400Mi"
            cpu: "512m"
        readinessProbe:
          httpGet: 
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
          initDelaySeconds: 60
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15 
          initDelaySeconds: 60
---

apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    tier: backend
spec:
  selector: 
    component: shipping  
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5
    