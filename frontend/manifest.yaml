apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: web
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /run/nginx.pid;

    include /usr/share/nginx/modules/*.conf;

    events {
      worker_connections 1024;
    }

    http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        root         /usr/share/nginx/html;

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }

        location /images/ {
          expires 5s;
          root   /usr/share/nginx/html;
          try_files $uri /images/placeholder.jpg;
        }
        location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
        location /api/user/ { proxy_pass http://user:8080/; }
        location /api/cart/ { proxy_pass http://cart:8080/; }
        location /api/shipping/ { proxy_pass http://shipping:8080/; }
        location /api/payment/ { proxy_pass http://payment:8080/; }

        location /health {
          stub_status on;
          access_log off;
        }

    }
    }

---
apiVersion: apps/v1
kind: Deployment  
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: web
spec:
  selector:
    matchLabels:
      project: roboshop
      component: frontend
      tier: web
  replicas: 1
  template: 
    metadata:
      labels:
        project: roboshop
        component: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: saikumar19/frontend:v2
          imagePullPolicy: Always
          ports:
            - name: liveness-port
              containerPort: 80
          resources:
            requests:
              memory: "100Mi"
              cpu: "128m"
            limits:
              memory: "100Mi"
              cpu: "128m"
          readinessProbe:
            httpGet: 
              path: /
              port: liveness-port
            failureThreshold: 3
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: liveness-port
            failureThreshold: 3
            initialDelaySeconds: 5
          volumeMounts:
          - name: frontend-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: nginx.conf
      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
               


---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: frontend
    tier: web 
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: frontend 
    tier: web  
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 8080  # container port

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5



          
          
          

        