# service , headless, statefulset, pvc
apiVersion: v1
kind: Service
metadata: 
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  selector:
    component: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
    
---
apiVersion: v1
kind: Service
metadata: 
  name: redis-headless
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: redis
    tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: redis
    tier: database
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roboshop
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: database
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: database
    spec:
      containers:
      - name: redis
        image: redis:7.0
        volumeMounts:
        - name: redis
          mountPath: /data
#  PVC
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      storageClassName: "ebs-roboshop"
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi