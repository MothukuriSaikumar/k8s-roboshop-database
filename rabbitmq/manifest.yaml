# service , headless, statefulset, pvc
apiVersion: v1
kind: Service
metadata: 
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: database
spec:
  selector:
    component: rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
    
---
apiVersion: v1
kind: Service
metadata: 
  name: rabbitmq-headless
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: rabbitmq
    tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: rabbitmq
    tier: database
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  serviceName: rabbitmq-headless
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: rabbitmq
      tier: database
  template:
    metadata:
      labels:
        project: roboshop
        component: rabbitmq
        tier: database
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "roboshop"
        - name: RABBITMQ_DEFAULT_PASS
          value: "roboshop123"
#  PVC
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq
    spec:
      storageClassName: "ebs-roboshop"
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi