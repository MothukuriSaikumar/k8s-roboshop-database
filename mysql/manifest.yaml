# service , headless, statefulset, pvc
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: roboshop 
data:
  my.cnf: |
     [mysqld]
     innodb_redo_log_capacity = 2G
  
---
apiVersion: v1
kind: Service
metadata: 
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
  selector:
    component: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
    
---
apiVersion: v1
kind: Service
metadata: 
  name: mysql-headless
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    component: mysql
    tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mysql
    tier: database
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  serviceName: mysql-headless
  replicas: 2
  selector:     # label selector
    matchLabels: 
      project: roboshop
      component: mysql
      tier: database
  template:      # pod template
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: database
    spec:
      containers:
      - name: mysql
        image: saikumar19/mysql:v2
        volumeMounts:
        - name: mysql
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config
          

         
            
#  PVC
  volumeClaimTemplates:
  - metadata:
      name: mysql
    spec:
      storageClassName: "ebs-roboshop"
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi